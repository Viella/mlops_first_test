name: MLOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手動実行を可能にする

jobs:
  # データ生成と学習
  training:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Create directories
      run: |
        mkdir -p data models
        
    - name: Generate training data
      run: |
        python src/data_generation.py --samples 500 --output data/hiring_data.csv
        
    - name: Train model
      run: |
        python src/train.py --data data/hiring_data.csv --model_output models/hiring_model.pkl
        
    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          models/
          data/hiring_data.csv
        retention-days: 30
        
    - name: Upload training logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: training-logs
        path: |
          models/metrics.json
        retention-days: 7

  # 推論テスト
  inference:
    runs-on: ubuntu-latest
    needs: training
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: .
        
    - name: Test single prediction
      run: |
        python src/inference.py --mode single \
          --age 30 --experience 5 --skill 8 --interview 7 --education 4
          
    - name: Test batch prediction
      run: |
        python src/inference.py --mode batch \
          --input data/hiring_data.csv \
          --output predictions.json
          
    - name: Upload prediction results
      uses: actions/upload-artifact@v4
      with:
        name: predictions
        path: predictions.json
        retention-days: 7

  # Docker構築テスト（オプション）
  docker-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build training Docker image
      run: |
        docker build -f docker/training.Dockerfile -t mlops-training .
        
    - name: Build inference Docker image
      run: |
        docker build -f docker/inference.Dockerfile -t mlops-inference .
        
    - name: Test Docker images
      run: |
        echo "Docker images built successfully"
        docker images | grep mlops

  # モデル性能チェック
  model-validation:
    runs-on: ubuntu-latest
    needs: training
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: .
        
    - name: Validate model performance
      run: |
        python -c "
        import json
        with open('models/metrics.json', 'r') as f:
            metrics = json.load(f)
        accuracy = metrics['accuracy']
        print(f'Model accuracy: {accuracy:.4f}')
        
        # 最小精度チェック（50%以上）
        if accuracy < 0.5:
            print('❌ Model accuracy is below threshold (50%)')
            exit(1)
        else:
            print('✅ Model accuracy is acceptable')
        "
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const metrics = JSON.parse(fs.readFileSync('models/metrics.json', 'utf8'));
          
          const comment = `## 📊 MLOps Pipeline Results
          
          ### Model Performance
          - **Accuracy**: ${(metrics.accuracy * 100).toFixed(2)}%
          
          ### Feature Importance
          ${Object.entries(metrics.feature_importance)
            .sort(([,a], [,b]) => b - a)
            .map(([feature, importance]) => `- **${feature}**: ${(importance * 100).toFixed(2)}%`)
            .join('\n')}
          
          Pipeline completed successfully! ✅`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          }); 